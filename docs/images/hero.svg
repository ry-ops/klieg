<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
<title id="t">Klieg</title>
<desc id="d">A stage light sweeps across four coding agents from herdr and OpenRig. One stops to ask for approval: its card glows orange, the menu-bar beacon shows 1, you answer, and it goes back to work and finishes.</desc>
