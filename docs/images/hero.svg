<text x="66" y="194" class="sans" font-size="22" fill="#ffdf9e">A spotlight on your coding agents.</text>
<text x="66" y="236" class="sans" font-size="16" fill="#8a92a6">Watch and steer herdr agents and OpenRig rigs</text>
<text x="66" y="262" class="sans" font-size="16" fill="#8a92a6">from a Mac app, a CLI, and an MCP server for Claude.</text>
