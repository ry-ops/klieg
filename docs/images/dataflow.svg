<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">Klieg: how a snapshot is made</title>
<desc id="d">herdr, OpenRig and GitHub send their state into Klieg&#x27;s Collector every round, and the Collector sends one snapshot on to Klieg.app, klieg status and klieg mcp. Midway OpenRig becomes unreachable: its box turns red, the Collector shows errors[&quot;openrig&quot;] with ssh&#x27;s &#x27;Host key verification failed&#x27;, herdr and GitHub keep flowing, and the timeline keeps the OpenRig seats so nothing reads as stopped. Then OpenRig recovers and everything flows again.</desc>
