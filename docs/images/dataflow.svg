<text class="sans f5" x="655.0" y="426" text-anchor="middle" font-size="13" fill="#8a92a6">Timeline.carryOver keeps the 4 seats, so nothing reads as <tspan fill="#e8eaf0">stopped</tspan>.</text>
<text class="sans f6" x="655.0" y="426" text-anchor="middle" font-size="13" fill="#8a92a6">OpenRig is back, and nothing reads as <tspan fill="#e8eaf0">new</tspan> either.</text>
