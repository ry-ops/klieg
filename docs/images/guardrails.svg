<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="t d">
<title id="t">Klieg&#x27;s guardrails</title>
<desc id="d">Three gates in turn. One: klieg_merge_pr refuses ry-ops/klieg#9 while its checks are pending, then merges it once CI passed and the head commit is verified, pinned to that commit. Two: operator-agent@kernel is stopped at a usage-credits prompt, and klieg_answer_prompt refuses to answer it. Three: the app asks before stopping a seat and before squash-merging a pull request.</desc>
