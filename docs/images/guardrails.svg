<rect class="g8" x="46" y="326" width="358" height="58" rx="9" fill="#ff6b6b" fill-opacity=".08" stroke="#ff6b6b" stroke-opacity=".5"/>
<text x="60" y="350.0" class="mono g8" font-size="12.5" fill="#ff6b6b" xml:space="preserve">← ry-ops/klieg#9 checks are pending,</text><text x="60" y="369.4" class="mono g8" font-size="12.5" fill="#ff6b6b" xml:space="preserve">  not green.</text>
<text class="mono g9" x="48" y="310" font-size="11" fill="#ffc861">→ klieg_merge_pr {&quot;repo&quot;: &quot;ry-ops/klieg&quot;, &quot;number&quot;: 9}</text>
<rect class="g10" x="46" y="326" width="358" height="82" rx="9" fill="#5be37d" fill-opacity=".08" stroke="#5be37d" stroke-opacity=".5"/>
<text x="60" y="350.0" class="mono g10" font-size="12.5" fill="#5be37d" xml:space="preserve">gh pr merge 9 --repo ry-ops/klieg</text><text x="60" y="369.4" class="mono g10" font-size="12.5" fill="#5be37d" xml:space="preserve">  --squash --match-head-commit 6ff2577…</text><text x="60" y="388.8" class="mono g10" font-size="12.5" fill="#5be37d" xml:space="preserve">← merged</text>
<text x="50" y="448.0" class="sans" font-size="12.5" fill="#8a92a6" xml:space="preserve">Refused: closed, draft, no checks,</text><text x="50" y="467.0" class="sans" font-size="12.5" fill="#8a92a6" xml:space="preserve">a failed or running check, or a head</text><text x="50" y="486.0" class="sans" font-size="12.5" fill="#8a92a6" xml:space="preserve">commit GitHub hasn&#x27;t verified.</text>
<rect x="443" y="64" width="394" height="470" rx="14" fill="#12151d" stroke="#262b38"/><rect class="g11" x="441" y="62" width="398" height="474" rx="16" fill="none" stroke="#ffc861" stroke-width="2" stroke-opacity=".8"/><circle cx="475" cy="96" r="13" fill="#ffc861" fill-opacity=".16"/><text x="475" y="101" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#ffc861">2</text><text x="499" y="102" class="sans" font-size="16" font-weight="700" fill="#e8eaf0">Billing prompts are yours</text>
<text x="465" y="146" class="sans" font-size="14" font-weight="700" fill="#e8eaf0">operator-agent@kernel</text>
<g><rect x="738.6" y="129" width="78.4" height="22" rx="11" fill="#ff9f43" fill-opacity=".18"/><circle cx="750.6" cy="140" r="3.5" fill="#ff9f43"/><text x="759.6" y="144.5" class="sans" font-size="12" font-weight="700" fill="#ff9f43">blocked</text></g>
<text x="465" y="166" class="sans" font-size="12" fill="#8a92a6">openrig · claude · reason: billing</text>
<rect x="461" y="180" width="358" height="168" rx="8" fill="#07080b" stroke="#262b38"/>
<rect class="g12" x="469" y="188" width="342" height="22" rx="4" fill="#ffc861" fill-opacity=".2"/>
<text x="475" y="204.0" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve">Fable 5.1 now uses usage credits</text><text x="475" y="220.5" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve"></text><text x="475" y="237.0" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve">Fable 5.1 runs on usage credits — you</text><text x="475" y="253.5" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve">have $XX.XX in credits.</text><text x="475" y="270.0" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve"></text><text x="475" y="286.5" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve">❯ Switch to Opus 5.5 and continue</text><text x="475" y="303.0" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve">  Manage usage credits on claude.ai</text><text x="475" y="319.5" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve"></text><text x="475" y="336.0" class="mono" font-size="11.5" fill="#c9ced8" xml:space="preserve">Enter to confirm · Esc to cancel</text>
<text x="463" y="374.0" class="mono g13" font-size="11.5" fill="#ffc861" xml:space="preserve">→ klieg_answer_prompt</text><text x="463" y="391.0" class="mono g13" font-size="11.5" fill="#ffc861" xml:space="preserve">  {&quot;agent&quot;: &quot;operator-agent@kernel&quot;, &quot;answer&quot;: &quot;1&quot;}</text>
<rect class="g14" x="461" y="402" width="358" height="98" rx="9" fill="#ff6b6b" fill-opacity=".08" stroke="#ff6b6b" stroke-opacity=".5"/>
<text x="475" y="426.0" class="mono g14" font-size="12" fill="#ff6b6b" xml:space="preserve">← operator-agent@kernel is showing a</text><text x="475" y="442.5" class="mono g14" font-size="12" fill="#ff6b6b" xml:space="preserve">  prompt about &quot;usage credit&quot;. Klieg</text><text x="475" y="459.0" class="mono g14" font-size="12" fill="#ff6b6b" xml:space="preserve">  doesn&#x27;t answer billing or usage-credit</text><text x="475" y="475.5" class="mono g14" font-size="12" fill="#ff6b6b" xml:space="preserve">  prompts; open the seat and answer it</text><text x="475" y="492.0" class="mono g14" font-size="12" fill="#ff6b6b" xml:space="preserve">  yourself.</text>
<text class="sans g15" x="465" y="522" font-size="12.5" fill="#8a92a6">In the app, Answer is off for billing prompts.</text>
<rect x="858" y="64" width="394" height="470" rx="14" fill="#12151d" stroke="#262b38"/><rect class="g16" x="856" y="62" width="398" height="474" rx="16" fill="none" stroke="#ffc861" stroke-width="2" stroke-opacity=".8"/><circle cx="890" cy="96" r="13" fill="#ffc861" fill-opacity=".16"/><text x="890" y="101" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#ffc861">3</text><text x="914" y="102" class="sans" font-size="16" font-weight="700" fill="#e8eaf0">The app asks first</text>
<g class="g17"><rect x="876" y="126" width="358" height="182" rx="12" fill="#171b25" stroke="#262b38"/><text x="1055.0" y="156" text-anchor="middle" class="sans" font-size="14.5" font-weight="700" fill="#e8eaf0">Stop dev-build@klieg-pair?</text><text x="1055.0" y="180" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">This ends the seat&#x27;s session and any turn in</text><text x="1055.0" y="198" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">progress. Its rig stays up; you can restart the</text><text x="1055.0" y="216" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">seat from OpenRig.</text><rect x="892" y="234" width="326" height="28" rx="7" fill="#ff6b6b" fill-opacity=".85"/><text x="1055.0" y="253" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="white">Stop dev-build@klieg-pair</text><rect x="892" y="268" width="326" height="28" rx="7" fill="#262b38"/><text x="1055.0" y="287" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#e8eaf0">Cancel</text></g>
<g class="g18"><rect x="876" y="322" width="358" height="200" rx="12" fill="#171b25" stroke="#262b38"/><text x="1055.0" y="352" text-anchor="middle" class="sans" font-size="14.5" font-weight="700" fill="#e8eaf0">Squash-merge ry-ops/klieg #9?</text><text x="1055.0" y="376" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">&quot;M4: README for 0.1.0&quot; goes into main as one</text><text x="1055.0" y="394" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">squashed commit and its branch is deleted.</text><text x="1055.0" y="412" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">Klieg checks again that CI passed and the</text><text x="1055.0" y="430" text-anchor="middle" class="sans" font-size="12" fill="#8a92a6">commit is signed.</text><rect x="892" y="448" width="326" height="28" rx="7" fill="#ff6b6b" fill-opacity=".85"/><text x="1055.0" y="467" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="white">Squash-merge ry-ops/klieg #9</text><rect x="892" y="482" width="326" height="28" rx="7" fill="#262b38"/><text x="1055.0" y="501" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#e8eaf0">Cancel</text></g>
<text x="640" y="560" text-anchor="middle" class="sans" font-size="14" fill="#8a92a6">Klieg refuses what only you should decide, and asks before anything that's hard to undo.</text>
</svg>
