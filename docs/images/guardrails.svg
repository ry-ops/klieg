<text x="62" y="244" class="sans" font-size="12.5" fill="#8a92a6">head commit</text>
<g><rect x="158" y="229" width="78" height="22" rx="11" fill="#5be37d" fill-opacity=".16"/><text x="168" y="244.5" class="sans" font-size="12" font-weight="700" fill="#5be37d">verified</text></g>
<text x="250" y="244" class="mono" font-size="12" fill="#4a5163">6ff2577</text>
