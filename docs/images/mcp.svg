<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
<title id="t">Klieg&#x27;s MCP tools</title>
<desc id="d">Klieg&#x27;s 12 MCP tools, four that read and eight that act, four of them marked destructive. Claude calls klieg_status on a read-only Klieg server and gets every agent&#x27;s state back, then calls klieg_prompt_agent and is refused: Klieg is read-only (KLIEG_READ_ONLY is set), so klieg_prompt_agent was refused. Nothing was changed.</desc>
<style>
